# Parameters
nc: 1 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOE-v8n summary: 148 layers, 3695183 parameters, 3695167 gradients, 19.5 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOE-v8s summary: 148 layers, 12759880 parameters, 12759864 gradients, 51.0 GFLOPs
  m: [0.67, 0.75, 768] # YOLOE-v8m summary: 188 layers, 28376158 parameters, 28376142 gradients, 110.5 GFLOPs
  l: [1.00, 1.00, 512] # YOLOE-v8l summary: 228 layers, 46832050 parameters, 46832034 gradients, 204.5 GFLOPs
  x: [1.00, 1.25, 512] # YOLOE-v8x summary: 228 layers, 72886377 parameters, 72886361 gradients, 309.3 GFLOPs

backbone:
  # [from, module, args]
  - [-1, Conv, [3, 64, 3, 2]] # 0-P1/2
  - [-1, Conv, [64, 128, 3, 2]] # 1-P2/4
  - [-1, C2f, [128, 128, 3, True]]
  - [-1, Conv, [128, 256, 3, 2]] # 3-P3/8
  - [-1, C2f, [256, 256, 6, True]]
  - [-1, Conv, [256, 512, 3, 2]] # 5-P4/16
  - [-1, C2f, [512, 512, 6, True]]
  - [-1, Conv, [512, 1024, 3, 2]] # 7-P5/32
  - [-1, C2f, [1024, 1024, 3, True]]
  - [-1, SPPF, [1024, 1024, 5]] # 9

# YOLOv8.0n head
head:
  - [-1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], Concat, [1]] # cat backbone P4
  - [-1, C2f, [512, 3, False]] # 12
  - [-1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], Concat, [1]] # cat backbone P3
  - [-1, C2f, [256, 3, False]] # 15 (P3/8-small)
  - [15, Conv, [256, 3, 2]]
  - [[-1, 12], Concat, [1]] # cat head P4
  - [-1, C2f, [512, 3, False]] # 18 (P4/16-medium)
  - [-1, Conv, [512, 3, 2]]
  - [[-1, 9], Concat, [1]] # cat head P5
  - [-1, C2f, [1024, 3, False]] # 21 (P5/32-large)
  - [[15, 18, 21], DetectHead, [nc, 512, True]] # YOLOEDetect(P3, P4, P5)